<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta: DSC 106 Portfolio Code Story</title>
    <link rel="stylesheet" href="../style.css?v=lab08-demo-5">
  </head>
  <body class="meta-page">
    <main>
      <section class="page-header">
        <p class="eyebrow">DSC 106 Lab 8</p>
        <h1>Code Story</h1>
        <p class="lead">
          A scrollytelling view of how this portfolio grew through commits and
          how the current code is distributed across files.
        </p>
      </section>

      <section id="scrolly-1" aria-label="Commit history scrollytelling">
        <aside id="scatter-story" class="story-sidebar"></aside>

        <div id="scatter-plot">
          <div class="plot-heading">
            <div>
              <h2>Commits by time of day</h2>
            </div>
            <p id="selection-count"></p>
          </div>

          <div id="chart"></div>

          <dl id="commit-tooltip" class="info tooltip" hidden>
            <dt>Commit</dt>
            <dd>
              <a id="commit-link" target="_blank" rel="noreferrer noopener"></a>
            </dd>
            <dt>Date</dt>
            <dd id="commit-date"></dd>
            <dt>Time</dt>
            <dd id="commit-time-detail"></dd>
            <dt>Lines</dt>
            <dd id="commit-lines"></dd>
          </dl>
        </div>
      </section>

      <section class="file-section" aria-label="File size scrollytelling">
        <h2>Codebase evolution</h2>
        <div id="scrolly-2">
          <div id="files-plot">
            <p id="file-count"></p>
            <dl id="files"></dl>
          </div>

          <aside id="files-story" class="story-sidebar"></aside>
        </div>
      </section>
    </main>

    <footer>
      <p>Built as a Doraemon-themed personal site for DSC 106 Labs.</p>
    </footer>

    <script src="../global.js?v=lab08-demo-5" type="module"></script>
    <script src="meta.js?v=lab08-demo-5" type="module"></script>
  </body>
</html>
